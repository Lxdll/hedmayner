name: hedmayner

services:
  web:
    image: ghcr.io/lxdll/hedmayner:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: hedmayner-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
