name: hedmayner

services:
  hedmayner:
    image: ghcr.io/lxdll/hedmayner:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: hedmayner-web
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - hedmayner-web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: luxudong_edge
    external: true
