name: Verify, publish, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing sha-... image tag to deploy (leave blank to deploy this commit)
        required: false
        type: string

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lxdll/hedmayner
  PNPM_VERSION: 11.12.0

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test importer
        run: pnpm test:importer

  publish:
    needs: verify
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: ${{ vars.TARGET_PLATFORM || 'linux/amd64' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && vars.DOMAIN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Select image tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          PUBLISHED_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          tag="${REQUESTED_TAG:-$PUBLISHED_TAG}"
          if [[ ! "$tag" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "$DEPLOY_PORT" compose.yaml deploy/deploy.sh deploy/rollback.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/hedmayner/"
      - name: Deploy and verify container
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          printf -v remote_command 'chmod 750 /opt/hedmayner/deploy.sh /opt/hedmayner/rollback.sh && /opt/hedmayner/deploy.sh %q %q' "$IMAGE_TAG" "$DOMAIN"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
      - name: Verify public HTTPS routes
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "https://$DOMAIN/" >/dev/null
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "https://$DOMAIN/collections" >/dev/null
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "https://$DOMAIN/media/collections/fall-winter-2026/manifest.json" >/dev/null
      - name: Roll back after a public verification failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          printf -v remote_command '/opt/hedmayner/rollback.sh %q' "$DOMAIN"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
